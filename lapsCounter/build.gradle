import java.util.Properties

plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.kapt)
    alias(libs.plugins.realm.android)
    alias(libs.plugins.navigation.safeargs.kotlin)
}

def releaseSigningProperties = new Properties()
def releaseSigningPropertiesFile = rootProject.file('keystore.properties')
if (releaseSigningPropertiesFile.isFile()) {
    releaseSigningPropertiesFile.withInputStream { releaseSigningProperties.load(it) }
}

def hasReleaseSigning = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].every {
    releaseSigningProperties.getProperty(it)?.trim()
}

android {
    namespace = 'br.com.helpdev.lapscounter'
    compileSdk libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        applicationId = 'br.com.helpdev.lapscounter'
        minSdk libs.versions.minSdk.get().toInteger()
        targetSdk libs.versions.targetSdk.get().toInteger()
        versionCode libs.versions.appVersionCode.get().toInteger()
        versionName libs.versions.appVersionName.get()
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        if (hasReleaseSigning) {
            create('release') {
                storeFile = rootProject.file(releaseSigningProperties.getProperty('storeFile'))
                storePassword = releaseSigningProperties.getProperty('storePassword')
                keyAlias = releaseSigningProperties.getProperty('keyAlias')
                keyPassword = releaseSigningProperties.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix = '.debug'
        }
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) signingConfig = signingConfigs.getByName('release')
        }
    }

    flavorDimensions += 'sport'
    productFlavors {
        swimming {
            dimension = 'sport'
            applicationIdSuffix = '.swimming'
        }
        running {
            dimension = 'sport'
            applicationIdSuffix = '.running'
        }
        cycling {
            dimension = 'sport'
            applicationIdSuffix = '.cycling'
        }
    }

    buildFeatures {
        viewBinding = true
        dataBinding = true
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

gradle.taskGraph.whenReady { graph ->
    def requestsSwimmingRelease = graph.allTasks.any { it.name.toLowerCase().contains('swimmingrelease') }
    if (requestsSwimmingRelease && !hasReleaseSigning) {
        throw new GradleException(
            'Swimming release signing is not configured. Add storeFile, storePassword, keyAlias, and keyPassword to the ignored root keystore.properties file.'
        )
    }
}

dependencies {
    implementation libs.chronometer.library
    implementation libs.google.mobile.ads
    implementation libs.google.ump
    implementation libs.androidx.appcompat
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.livedata.ktx
    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation libs.androidx.localbroadcastmanager
    implementation libs.androidx.navigation.fragment.ktx
    implementation libs.androidx.navigation.ui.ktx
    implementation libs.androidx.preference.ktx
    implementation libs.material

    testImplementation libs.junit
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.runner
}
